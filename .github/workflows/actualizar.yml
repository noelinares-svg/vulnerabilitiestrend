name: Actualizar datos y publicar

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas (UTC)
  workflow_dispatch:          # botón "Run workflow" para actualizar a demanda
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Recolectar datos
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/collect.py site/data.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
